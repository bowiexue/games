<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Arcade App</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app-window">
    <header>
        <button id="home-btn" onclick="goToHome()">MENU</button>
        <h1 id="screen-title">PIXEL SYSTEM</h1>
    </header>

    <!-- HUB VIEW -->
    <div id="view-hub" class="game-view active">
        <div class="menu-grid">
            <button class="grid-card" onclick="loadGame('cafe')">SHIBA CAFE</button>
            <button class="grid-card" onclick="loadGame('scrap')">SCRAPBOOK</button>
            <button class="grid-card" onclick="loadGame('tycoon')">GARDEN TYCOON</button>
            <button class="grid-card" onclick="loadGame('pet')">VIRTUAL PET</button>
            <button class="grid-card" onclick="loadGame('catcher')">STAR JAR</button>
        </div>
    </div>

    <!-- 1. SHIBA CAFE -->
    <div id="view-cafe" class="game-view">
        <div class="hud">CASH: $<span id="cafe-cash">0</span> | TASK: <span id="cafe-task">Fetch Drink</span></div>
        <canvas id="cafeCanvas" width="600" height="360"></canvas>
    </div>

    <!-- 2. SCRAPBOOK -->
    <div id="view-scrap" class="game-view">
        <div class="toolbar">
            <button onclick="setScrapTool('draw')">DRAW</button>
            <button onclick="setScrapTool('sticker1')">+HEART</button>
            <button onclick="setScrapTool('sticker2')">+STAR</button>
            <input type="color" id="scrap-color" value="#ff6b81">
            <button onclick="clearScrapbook()">RESET</button>
        </div>
        <canvas id="scrapCanvas" width="600" height="360"></canvas>
    </div>

    <!-- 3. GARDEN TYCOON -->
    <div id="view-tycoon" class="game-view">
        <div class="hud">CRYSTALS: <span id="tycoon-gems">10</span></div>
        <div class="tycoon-container">
            <canvas id="tycoonCanvas" width="400" height="360"></canvas>
            <div class="side-shop">
                <button onclick="buyTycoonUpgrade('plot')">BUY PLOT (20 C)</button>
                <button onclick="buyTycoonUpgrade('water')">SPRINKLER (40 C)</button>
            </div>
        </div>
    </div>

    <!-- 4. VIRTUAL PET -->
    <div id="view-pet" class="game-view">
        <div class="hud">TOKENS: <span id="pet-tokens">0</span> | HUNGER: <span id="pet-hunger">100</span>%</div>
        <div class="pet-container">
            <canvas id="petCanvas" width="400" height="300"></canvas>
            <div class="side-shop">
                <button onclick="handlePetAction('feed')">FEED TREAT</button>
                <button onclick="handlePetAction('pet')">PET ANIMAL</button>
                <button onclick="buyPetCosmetic('hat')">BUY HAT (5 T)</button>
                <button onclick="buyPetCosmetic('bow')">BUY BOW (3 T)</button>
            </div>
        </div>
    </div>

    <!-- 5. STAR JAR -->
    <div id="view-catcher" class="game-view">
        <div class="hud">STARS CATCHED: <span id="star-score">0</span></div>
        <div class="catcher-container">
            <canvas id="starCanvas" width="440" height="360"></canvas>
            <div class="side-shop">
                <button onclick="upgradeNet('#ff4757')">RED NET (10 S)</button>
                <button onclick="upgradeNet('#1e90ff')">BLUE NET (25 S)</button>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
